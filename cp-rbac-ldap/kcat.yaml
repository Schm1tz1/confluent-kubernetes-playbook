apiVersion: v1
kind: Pod
metadata:
  name: kcat
  namespace: confluent
spec:
  containers:
  - name: cp-kcat
    image: confluentinc/cp-kcat:7.9.1
    command: ['sh', '-c', 'tail -f /dev/null']
    volumeMounts:
      - name: tls-certs
        mountPath: /mnt/certs
        readOnly: true
      - name: kcat-configs
        mountPath: /mnt/configs        
        readOnly: true
  volumes:
    - name: tls-certs
      secret:
        secretName: tls-kafka
    - name: kcat-configs
      configMap:
        defaultMode: 420
        name: kcat-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kcat-config
  namespace: confluent
data:
  kcat-plain.conf: |
    bootstrap.servers=kafka.confluent.svc.cluster.local:9092
    security.protocol=SASL_PLAINTEXT
    sasl.mechanisms=PLAIN
    sasl.username=kafka
    sasl.password=kafka-secret
  kcat-plain-tls.conf: |
    bootstrap.servers=kafka.confluent.svc.cluster.local:9092
    security.protocol=SASL_SSL
    ssl.ca.location=/mnt/certs/ca.crt
    sasl.mechanisms=PLAIN
    sasl.username=kafka
    sasl.password=kafka-secret
  # External SASL_SSL listener with LDAP callback on port 9092.
  # username/password must be a real LDAP uid from openldap.yaml — peter is a
  # member of the admins group (=> SystemAdmin). Rejected on the 9093 static listener.
  kcat-ldap-tls-9092.conf: |
    bootstrap.servers=kafka.confluent.svc.cluster.local:9092
    security.protocol=SASL_SSL
    ssl.ca.location=/mnt/certs/ca.crt
    sasl.mechanisms=PLAIN
    sasl.username=peter
    sasl.password=ELERbgP7SFyy
  # Custom SASL_SSL listener (static creds via plain-jaas.conf) on port 9093.
  # username/password must match plain-jaas.conf (== LDIF uid=kafka).
  kcat-plain-tls-9093.conf: |
    bootstrap.servers=kafka.confluent.svc.cluster.local:9093
    security.protocol=SASL_SSL
    ssl.ca.location=/mnt/certs/ca.crt
    sasl.mechanisms=PLAIN
    sasl.username=kafka
    sasl.password=yZvEFM3AV7mj
