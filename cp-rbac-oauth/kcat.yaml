apiVersion: v1
kind: Pod
metadata:
  name: kcat
  namespace: confluent
spec:
  containers:
  - name: cp-kcat
    image: confluentinc/cp-kcat:8.2.3
    command: ['sh', '-c', 'tail -f /dev/null']
    volumeMounts:
      - name: tls-certs
        mountPath: /mnt/certs
        readOnly: true
      - name: kcat-configs
        mountPath: /mnt/configs        
        readOnly: true
  volumes:
    - name: tls-certs
      secret:
        secretName: tls-client
    - name: kcat-configs
      configMap:
        defaultMode: 420
        name: kcat-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kcat-config
  namespace: confluent
data:
  kcat-mtls.conf: |
    # Custom mTLS listener (client cert CN=client -> User:client)
    bootstrap.servers=kafka.confluent.svc.cluster.local:9094
    security.protocol=SSL
    ssl.ca.location=/mnt/certs/ca.crt
    ssl.key.location=/mnt/certs/tls.key
    # ssl.key.password=changeme
    ssl.certificate.location=/mnt/certs/tls.crt
  # No kcat-oauth.conf: cp-kcat images bundle librdkafka <1.9.0, which lacks
  # sasl.oauthbearer.method=oidc support. Test the OAuth listener with the
  # JVM clients on the kafka-* pods instead - see README.md.
