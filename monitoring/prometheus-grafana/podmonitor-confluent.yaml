apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: prometheus
    monitoring: confluent
  name: pm-confluent
  namespace: monitoring
spec:
  namespaceSelector:
    any: true
  jobLabel: platform.confluent.io/type
  podTargetLabels:
    - app
    - clusterId
    - confluent-platform
    - platform.confluent.io/type
    - type
  podMetricsEndpoints:
    - port: prometheus
      interval: 60s
      scheme: http
      scrapeTimeout: 30s
  selector:
    matchExpressions:
      - key: confluent-platform
        operator: Exists
