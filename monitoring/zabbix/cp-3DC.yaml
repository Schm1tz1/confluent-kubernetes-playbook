---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jmx-pod-overlay
  namespace: dc1
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled:  "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dc1,dc2,dc3"
data:
  pod-template.yaml: |    
    spec:
      template:
        spec:
          initContainers:
          - name: busybox
            image: busybox:1.28
            command:
              - sh
              - "-c"
              - "cp -v /mnt/jmx-in/* /mnt/jmx/"
              - "chmod 600 /mnt/jmx/*"
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - name: jmx-in
                mountPath: /mnt/jmx-in
                readOnly: true
              - name: jmx
                mountPath: /mnt/jmx
          volumes:
            - name: jmx-in
              secret:
                secretName: jmx-configs
---
apiVersion: v1
kind: Secret
metadata:
  name: jmx-configs
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled:  "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dc1,dc2,dc3"
stringData:
  password.properties: |
    monitorRole monitorRole
    controlRole controlRole
    zabbix zabbix
  access.properties: |
    monitorRole readonly
    controlRole readwrite
    zabbix readonly
---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: dc1
  annotations:
    platform.confluent.io/broker-id-offset: '910'
    platform.confluent.io/pod-overlay-configmap-name: "jmx-pod-overlay"
spec:
  replicas: 1
  clusterID: ZjczNWY5ZjItZTA3OS00Nw
  controllerQuorumVoters:
    - brokerEndpoint: kraftcontroller-0-internal.dc1:9074
      nodeId: 910
    - brokerEndpoint: kraftcontroller-0-internal.dc2:9074
      nodeId: 920
    - brokerEndpoint: kraftcontroller-0-internal.dc3:9074
      nodeId: 930
  oneReplicaPerNode: true
  dataVolumeCapacity: 1G
  podTemplate:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
  image:
    application: confluentinc/cp-server:7.9.1
    init: confluentinc/confluent-init-container:2.11.1
  mountedVolumes:
    volumes:
      - name: jmx
        emptyDir:
          sizeLimit: 10Mi
    volumeMounts:
      - name: jmx
        mountPath: /mnt/jmx
  configOverrides:
    jvm:
      - "-Dcom.sun.management.jmxremote.authenticate=false"
      - "-Dcom.sun.management.jmxremote.password.file=/mnt/jmx/password.properties"
      - "-Dcom.sun.management.jmxremote.access.file=/mnt/jmx/access.properties"
    server:
      - default.replication.factor=3
      - min.insync.replicas=2
      - confluent.metadata.topic.replication.factor=3
      - confluent.metadata.topic.min.insync.replicas=2
      - confluent.balancer.topic.replication.factor=3
      - offsets.topic.replication.factor=3
      - offsets.topic.min.isr=2
      - transaction.state.log.replication.factor=3
      - confluent.link.metadata.topic.replication.factor=3
      - confluent.tier.metadata.replication.factor=3
      - confluent.license.topic.replication.factor=3
      - confluent.cluster.link.metadata.topic.replication.factor=3
      - confluent.metadata.topic.min.insync.replicas=2
      - confluent.security.event.logger.exporter.kafka.topic.replicas=2
      - event.logger.exporter.kafka.topic.replicas=2
      - replica.selector.class=org.apache.kafka.common.replica.RackAwareReplicaSelector
      - broker.rack=dc1
---
